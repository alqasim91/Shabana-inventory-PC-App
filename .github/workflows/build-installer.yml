name: Build Windows installer

# Every push to main produces a new downloadable installer as a GitHub
# Release asset — see BUILD_PLAN.md "Build pipeline". Runs on a real
# windows-latest runner (not Wine), so Inno Setup compiles natively.
#
# Version pins below were verified against each project's actual latest
# GitHub release at the time this workflow was written (2026-08-09) — see
# BUILD_PLAN.md changelog note. Bump deliberately, not blindly; re-verify
# asset filenames against the release page when you do, they change
# between major versions (e.g. Postgres 18 vs 17 naming).

on:
  push:
    branches: [main]
  workflow_dispatch:

# softprops/action-gh-release needs contents:write to create the Release and
# attach the installer. The default GITHUB_TOKEN is read-only otherwise.
permissions:
  contents: write

env:
  POSTGRES_VERSION: "18.4.0"
  POSTGREST_VERSION: "v16.0"
  CADDY_VERSION: "2.11.4"
  GOTRUE_VERSION: "v2.195.0"
  NSSM_VERSION: "2.24"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout PC-App repo
        uses: actions/checkout@v4
        with:
          path: pc-app

      # The frontend is VENDORED into this repo (frontend/) — a read-only
      # copy of the Shabana-Inventory source, which this repo now owns and
      # can diverge (PC-only screens etc.). No cross-repo checkout, no PAT.
      # Built with placeholder tokens for VITE_SUPABASE_URL/ANON_KEY that
      # patch-frontend-config.ps1 replaces per-machine at install time —
      # see BUILD_PLAN.md "Why not build-time secrets". Re-syncing this
      # copy against cloud improvements is a manual step, by design.

      - name: Set version
        id: version
        shell: bash
        run: echo "version=0.1.0-$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Create payload skeleton
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pc-app/installer/payload/bin/pg
          New-Item -ItemType Directory -Force -Path pc-app/installer/payload/bin/postgrest
          New-Item -ItemType Directory -Force -Path pc-app/installer/payload/bin/gotrue
          New-Item -ItemType Directory -Force -Path pc-app/installer/payload/bin/caddy
          New-Item -ItemType Directory -Force -Path pc-app/installer/payload/bin/nssm
          New-Item -ItemType Directory -Force -Path pc-app/installer/payload/www-src
          New-Item -ItemType Directory -Force -Path pc-app/installer/payload/supabase
          New-Item -ItemType Directory -Force -Path pc-app/installer/payload/installer

      # --- Postgres (theseus-rs/postgresql-binaries — portable msvc build) ---
      # The zip nests everything under a top-level `postgresql-<ver>-...`
      # folder, so extract to a temp dir and flatten that one level into
      # bin/pg — provision.ps1 / register-services.ps1 expect
      # bin\pg\bin\initdb.exe (no version folder in the path).
      - name: Download Postgres
        shell: pwsh
        run: |
          $url = "https://github.com/theseus-rs/postgresql-binaries/releases/download/${{ env.POSTGRES_VERSION }}/postgresql-${{ env.POSTGRES_VERSION }}-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile pg.zip
          Expand-Archive -Path pg.zip -DestinationPath pg-extracted -Force
          $inner = Get-ChildItem -Path pg-extracted -Directory | Select-Object -First 1
          Copy-Item -Path (Join-Path $inner.FullName '*') -Destination pc-app/installer/payload/bin/pg -Recurse -Force
          if (-not (Test-Path 'pc-app/installer/payload/bin/pg/bin/initdb.exe')) {
            throw 'Postgres layout unexpected: bin/pg/bin/initdb.exe missing after flatten'
          }

      # --- PostgREST ---
      - name: Download PostgREST
        shell: pwsh
        run: |
          $url = "https://github.com/PostgREST/postgrest/releases/download/${{ env.POSTGREST_VERSION }}/postgrest-${{ env.POSTGREST_VERSION }}-windows-x86-64.zip"
          Invoke-WebRequest -Uri $url -OutFile postgrest.zip
          Expand-Archive -Path postgrest.zip -DestinationPath pc-app/installer/payload/bin/postgrest -Force

      # --- Caddy ---
      - name: Download Caddy
        shell: pwsh
        run: |
          $url = "https://github.com/caddyserver/caddy/releases/download/v${{ env.CADDY_VERSION }}/caddy_${{ env.CADDY_VERSION }}_windows_amd64.zip"
          Invoke-WebRequest -Uri $url -OutFile caddy.zip
          Expand-Archive -Path caddy.zip -DestinationPath pc-app/installer/payload/bin/caddy -Force

      # --- NSSM (service wrapper for PostgREST/GoTrue/Caddy) ---
      - name: Download NSSM
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://nssm.cc/release/nssm-${{ env.NSSM_VERSION }}.zip" -OutFile nssm.zip
          Expand-Archive -Path nssm.zip -DestinationPath nssm-extracted -Force
          Copy-Item "nssm-extracted/nssm-${{ env.NSSM_VERSION }}/win64/nssm.exe" pc-app/installer/payload/bin/nssm/nssm.exe

      # --- GoTrue: no official Windows release exists (verified against the
      # supabase/auth releases API — linux/darwin/arm64 only), AND the source
      # does not cross-compile to Windows as-is: cmd/serve_cmd.go sets
      # SO_REUSEPORT via golang.org/x/sys/unix, which has no Windows
      # equivalent (this is almost certainly WHY there's no Windows build).
      #
      # SO_REUSEPORT lets multiple processes share a listening port — a
      # zero-downtime-restart / multi-instance optimization that a single
      # Windows service does not need. We neutralize exactly that one line
      # (serve_cmd.go is the ONLY first-party file importing x/sys/unix,
      # verified) and drop the now-unused import, then build. The socket is
      # created without SO_REUSEPORT, which is correct for our single
      # instance. If a future GoTrue bump moves this, the grep guard below
      # fails loudly instead of silently shipping a broken binary. ---
      - name: Build GoTrue for Windows
        shell: bash
        run: |
          git clone --depth 1 --branch ${{ env.GOTRUE_VERSION }} https://github.com/supabase/auth.git gotrue-src
          cd gotrue-src
          # Neutralize the Unix-only SO_REUSEPORT sockopt and drop its import.
          sed -i 's|serr = unix.SetsockoptInt.*|serr = nil // SO_REUSEPORT unavailable on Windows; not needed for a single instance|' cmd/serve_cmd.go
          sed -i '\#golang.org/x/sys/unix#d' cmd/serve_cmd.go
          if grep -q 'unix\.' cmd/serve_cmd.go; then
            echo "ERROR: x/sys/unix still referenced in serve_cmd.go after patch — GoTrue layout changed, update the patch." >&2
            exit 1
          fi
          GOOS=windows GOARCH=amd64 go build -o ../pc-app/installer/payload/bin/gotrue/gotrue.exe .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # --- Frontend: the vendored copy under frontend/. Built with
      # placeholder tokens standing in for VITE_SUPABASE_URL/
      # VITE_SUPABASE_ANON_KEY — Vite bakes these in as literal strings,
      # and installer/scripts/patch-frontend-config.ps1 replaces them with
      # each customer's real values at install time. These token strings
      # MUST match patch-frontend-config.ps1 exactly — see that script's
      # header. ---
      - name: Build frontend
        shell: bash
        env:
          # Bare tokens, no protocol prefix here — patch-frontend-config.ps1
          # replaces each token with a full "http://localhost:PORT" value
          # that already includes the scheme. Prefixing it here too would
          # double it up into "http://http://...".
          VITE_SUPABASE_URL: "__SHABANA_RUNTIME_SUPABASE_URL__"
          VITE_SUPABASE_ANON_KEY: "__SHABANA_RUNTIME_ANON_KEY__"
        run: |
          cd pc-app/frontend
          npm ci
          npm run build
          cp -r dist/* ../installer/payload/www-src/
          # Fail the BUILD if the placeholders didn't make it into the bundle.
          # Without this the breakage only shows up on a customer's machine, as
          # an install that refuses to provision.
          for tok in __SHABANA_RUNTIME_SUPABASE_URL__ __SHABANA_RUNTIME_ANON_KEY__; do
            if ! grep -rq "$tok" ../installer/payload/www-src/; then
              echo "Placeholder $tok missing from the built frontend."
              exit 1
            fi
          done
          echo 'Both placeholder tokens present in the built frontend.'

      - name: Copy migrations + installer scripts into payload
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force pc-app/supabase/* pc-app/installer/payload/supabase/
          Copy-Item -Recurse -Force pc-app/installer/scripts pc-app/installer/payload/installer/
          Copy-Item -Recurse -Force pc-app/installer/config pc-app/installer/payload/installer/
          # Default shortcut target. provision.ps1 rewrites it with the real
          # port, but shipping it means the shortcut is never a dead file if
          # provisioning fails - the user gets a page that won't load instead
          # of a 'cannot find the file' error from Windows.
          Copy-Item -Force pc-app/installer/Shabana.url pc-app/installer/payload/Shabana.url

      # Parse every script on real Windows BEFORE packaging. A syntax error
      # here used to surface only on a customer's PC, as an installer that
      # silently did nothing. Also re-check the ASCII rule: Windows PowerShell
      # 5.1 reads a BOM-less .ps1 as Windows-1252, so a stray non-ASCII
      # character (an em-dash in a comment is enough) corrupts the parse.
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $bad = $false
          Get-ChildItem pc-app/installer/scripts/*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $bad = $true
              Write-Host "PARSE ERROR in $($_.Name):"
              $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
            }
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            if ($bytes | Where-Object { $_ -gt 127 }) {
              $bad = $true
              Write-Host "NON-ASCII bytes in $($_.Name) - PowerShell 5.1 will mis-decode this file."
            }
          }
          if ($bad) { throw 'PowerShell script validation failed.' }
          Write-Host 'All scripts parse cleanly and are pure ASCII.'

      # Run the ENTIRE install on the runner - which is real Windows, admin,
      # with real services - and then drive the app over HTTP exactly as a
      # browser would. Every failure this project has shipped to a customer so
      # far (a non-idempotent bootstrap, migrations that assumed pre-existing
      # data, placeholder tokens consumed on first patch, `2>` promoting a
      # native command's stderr to a terminating error) would have been caught
      # right here instead of on the shop's PC.
      - name: Smoke test - provision and drive the stack
        shell: pwsh
        env:
          SHABANA_NONINTERACTIVE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          # Under ProgramData, like a real install - not RUNNER_TEMP, whose
          # ACLs are not representative of a customer's machine.
          $root = 'C:\ProgramData\ShabanaSmoke'
          if (Test-Path $root) { Remove-Item $root -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          foreach ($d in 'bin','www-src','supabase','installer') {
            Copy-Item -Recurse -Force "pc-app/installer/payload/$d" (Join-Path $root $d)
          }

          & (Join-Path $root 'installer\scripts\provision.ps1') -InstallDir $root
          if ($LASTEXITCODE -ne 0) { throw "provision.ps1 exited $LASTEXITCODE" }

          $port = (Get-Content (Join-Path $root 'config\http-port.txt') -Raw).Trim()
          $anon = (Get-Content (Join-Path $root 'config\anon.key') -Raw).Trim()
          $base = "http://localhost:$port"
          $hdr  = @{ apikey = $anon; Authorization = "Bearer $anon"; 'Content-Type' = 'application/json' }

          # GoTrue runs its own migrations on first start; give it a moment
          # before expecting the auth endpoint to answer.
          $authUp = $false
          for ($i = 0; $i -lt 30; $i++) {
            try { Invoke-WebRequest "$base/auth/v1/health" -UseBasicParsing -TimeoutSec 3 | Out-Null; $authUp = $true; break }
            catch { Start-Sleep -Seconds 2 }
          }
          if (-not $authUp) { throw 'GoTrue never came up on /auth/v1/health' }

          # 1. Fresh install must report that it needs setup. Retried, because
          #    PostgREST may still be reloading its schema cache.
          $needs = $null
          for ($i = 0; $i -lt 15; $i++) {
            try { $needs = Invoke-RestMethod -Method Post -Uri "$base/rest/v1/rpc/pc_needs_setup" -Headers $hdr -Body '{}'; break }
            catch { Start-Sleep -Seconds 2 }
          }
          if ($needs -ne $true) { throw "pc_needs_setup returned '$needs', expected true on a fresh install" }

          # 2. Claim the install, exactly as the first-run screen does.
          $body = @{
            p_business_name  = 'Smoke Test Co'
            p_admin_fullname = 'Smoke Admin'
            p_admin_username = 'admin'
            p_admin_password = 'smoke-test-password'
            p_site_name      = 'Main Branch'
          } | ConvertTo-Json
          $boot = Invoke-RestMethod -Method Post -Uri "$base/rest/v1/rpc/pc_first_run_bootstrap" -Headers $hdr -Body $body
          if (-not $boot.ok) { throw "pc_first_run_bootstrap failed: $($boot | ConvertTo-Json -Compress)" }

          # 3. Log in through GoTrue with the account it just minted.
          $login = Invoke-RestMethod -Method Post -Uri "$base/auth/v1/token?grant_type=password" `
            -Headers $hdr -Body (@{ email = 'admin@shabana.local'; password = 'smoke-test-password' } | ConvertTo-Json)
          if (-not $login.access_token) { throw 'Login returned no access_token' }

          # 4. Read real data with that token. This is the end-to-end proof:
          #    Caddy routing, PostgREST, the JWT, auth.uid() reading the JSON
          #    claims GUC, and the org-scoped RLS policies all have to be right
          #    for this single call to return a row.
          $auth = @{ apikey = $anon; Authorization = "Bearer $($login.access_token)" }
          $sites = Invoke-RestMethod -Uri "$base/rest/v1/sites?select=name_ar" -Headers $auth
          if ($sites.Count -lt 1) { throw 'Authenticated read of sites returned nothing - RLS or auth.uid() is wrong' }

          # 5. And it must refuse to be claimed twice.
          $again = Invoke-RestMethod -Method Post -Uri "$base/rest/v1/rpc/pc_first_run_bootstrap" -Headers $hdr -Body $body
          if ($again.ok) { throw 'Second bootstrap succeeded - the one-shot guard is broken' }

          Write-Host "SMOKE TEST PASSED - provisioned, claimed, logged in, read site '$($sites[0].name_ar)'."

      - name: Smoke test cleanup
        if: always()
        shell: pwsh
        run: |
          Stop-Service ShabanaCaddy,ShabanaGoTrue,ShabanaPostgREST,ShabanaPostgres -EA SilentlyContinue
          $nssm = 'C:\ProgramData\ShabanaSmoke\bin\nssm\nssm.exe'
          if (Test-Path $nssm) { 'ShabanaCaddy','ShabanaGoTrue','ShabanaPostgREST' | % { & $nssm remove $_ confirm } }
          $pgctl = 'C:\ProgramData\ShabanaSmoke\bin\pg\bin\pg_ctl.exe'
          if (Test-Path $pgctl) { & $pgctl unregister -N ShabanaPostgres }
          exit 0

      - name: Compile installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        env:
          SHABANA_VERSION: ${{ steps.version.outputs.version }}
        with:
          path: pc-app/installer/setup.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: shabana-installer
          path: pc-app/installer/Output/*.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: pc-app/installer/Output/*.exe
          body: |
            Automated build from commit ${{ github.sha }}.
            Not yet verified on real Windows hardware — see BUILD_PLAN.md
            "Testing" section before treating this as customer-ready.
